<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c2b5e">
<title>آزمونک | پلتفرم آزمون خصوصی ریاضی</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d92c45'/%3E%3Cpath d='M16 34l10 12 22-28' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
@font-face{font-family:'Lalezar';src:url('https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/lalezar/Lalezar-Regular.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f6f3ea;--grid:rgba(43,72,140,.075);--ink:#1c2b5e;--ink-2:#33427e;--line:#ddd6c4;--pen:#d92c45;--pen-soft:#fdeef0;--ok:#178f56;--ok-soft:#e4f5ec;--amber:#d98a10}
html{scroll-behavior:smooth}
body{font-family:'Vazirmatn',system-ui,sans-serif;color:var(--ink);min-height:100vh;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.margin-line{position:fixed;top:0;bottom:0;right:34px;width:2px;background:rgba(217,44,69,.16);pointer-events:none;z-index:0}
#bg-syms{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg-syms span{position:absolute;font-family:Lalezar;color:var(--ink);opacity:.05;animation:floaty 9s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(-14px) rotate(-6deg)}to{transform:translateY(16px) rotate(7deg)}}
#app{position:relative;z-index:1}
a{color:var(--ink-2)}
.disp{font-family:'Lalezar','Vazirmatn',sans-serif;font-weight:400}
.wrap{max-width:1100px;margin:0 auto;padding:26px 18px}
.wrap.narrow{max-width:780px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(30,40,80,.05),0 12px 30px -20px rgba(30,40,80,.3)}
.pad{padding:22px}
.center{text-align:center}
.fade-up{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn{font-family:inherit;font-size:15px;font-weight:700;border:none;cursor:pointer;border-radius:11px;padding:11px 20px;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:var(--ink-2);transform:translateY(-2px);box-shadow:0 10px 20px -8px rgba(28,43,94,.5)}
.btn-ghost{background:#fff;border:1.5px solid var(--ink);color:var(--ink)}
.btn-ghost:hover{background:rgba(28,43,94,.07);transform:translateY(-1px)}
.btn-danger{background:var(--pen);color:#fff}
.btn-danger:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-danger-o{background:var(--pen-soft);color:var(--pen)}
.btn-danger-o:hover{background:#f9d7dd}
.btn-outline-inv{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff}
.btn-outline-inv:hover{background:rgba(255,255,255,.14)}
.btn-pen{background:var(--pen);color:#fff}
.btn-pen:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.big{font-size:17px;padding:14px 30px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
.btn.full{width:100%}
.inp{width:100%;font-family:inherit;font-size:15px;padding:11px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);transition:.15s}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,43,94,.13)}
.lbl{display:block;font-size:13px;font-weight:800;margin:12px 0 6px;color:var(--ink-2)}
.hint{font-size:12.5px;color:#8a8fa6;margin-top:8px;line-height:1.9}
.topbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;box-shadow:0 2px 16px rgba(20,30,70,.28)}
.topbar .inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.logo{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:25px;display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none}
.logo .tick,.tick{background:var(--pen);color:#fff;border-radius:9px;display:grid;place-items:center;font-weight:800;transform:rotate(-7deg)}
.logo .tick{width:27px;height:27px;font-size:16px}
.tick.big{width:56px;height:56px;border-radius:16px;font-size:32px;box-shadow:0 12px 26px -10px rgba(217,44,69,.65)}
.spacer{flex:1}
.who{font-size:14px;font-weight:600;opacity:.92}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{color:rgba(255,255,255,.75);text-decoration:none;padding:7px 13px;border-radius:10px;font-size:14px;font-weight:700;transition:.15s}
.tab:hover{background:rgba(255,255,255,.13);color:#fff}
.tab.active{background:var(--pen);color:#fff}
.login-page{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;gap:36px;max-width:1050px;margin:0 auto;padding:48px 22px;align-items:center}
@media(max-width:860px){.login-page{grid-template-columns:1fr;padding-top:56px}}
.login-hero h1{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:78px;line-height:1}
.hero-logo{display:flex;align-items:center;gap:16px}
.tag{font-size:18px;color:var(--ink-2);margin:12px 0 24px;font-weight:500}
.feats{list-style:none;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.feats li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 3px 12px -8px rgba(30,40,80,.35)}
.login-card{padding:32px}
.login-card h2{font-size:30px;margin-bottom:6px}
.exambar{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 18px rgba(20,30,70,.32)}
.exambar .tinfo{display:flex;flex-direction:column;gap:2px;min-width:150px}
.exambar .tinfo b{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:19px;font-weight:400}
.exambar .tinfo span{font-size:12px;opacity:.75}
.exambar .tmr{display:flex;align-items:center;gap:10px}
.lbl2{font-size:12px;opacity:.8}
.timerbox{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:28px;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.4);border-radius:12px;padding:1px 16px;min-width:104px;text-align:center;font-variant-numeric:tabular-nums}
.timerbox.low{background:var(--pen);border-color:var(--pen);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(217,44,69,.22)}}
.exambar .ans{font-size:13px;opacity:.9}
.timebar{height:4px;background:rgba(28,43,94,.15)}
.timebar i{display:block;height:100%;background:var(--pen);transition:width .25s linear}
.q-card{padding:20px;margin-bottom:18px}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.q-num{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:19px;background:var(--ink);color:#fff;padding:2px 16px;border-radius:10px}
.qimg{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px;cursor:zoom-in;margin-bottom:14px;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;cursor:pointer;transition:.16s;font-weight:700;font-size:15px;text-align:right;font-family:inherit}
.opt:hover{border-color:var(--ink-2);transform:translateY(-1px)}
.opt .n{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:'Lalezar','Vazirmatn',sans-serif;font-size:18px;transition:.16s;flex:none}
.opt.sel{border-color:var(--ink);background:rgba(28,43,94,.07)}
.opt.sel .n{background:var(--ink);color:#fff;animation:pop .25s}
@keyframes pop{50%{transform:scale(1.28)}}
.opt.ro{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .n{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.bad{border-color:var(--pen);background:var(--pen-soft)}
.opt.bad .n{border-color:var(--pen);background:var(--pen);color:#fff}
.tag{margin-right:auto;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-bad{background:var(--pen-soft);color:var(--pen)}
.exam-hint{background:#fdf6e7;border:1px dashed var(--amber);border-radius:12px;padding:10px 16px;font-size:13.5px;margin-bottom:18px}
.result-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-top:26px}
.gauge{position:relative;width:170px;height:170px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:grid;place-items:center;font-family:'Lalezar','Vazirmatn',sans-serif;font-size:44px}
.r-text{flex:1;min-width:230px}
.r-msg{margin:10px 0 14px;font-weight:600;color:var(--ink-2)}
.r-stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;padding:4px 13px;border-radius:99px;font-size:13px;font-weight:800}
.chip.g{background:var(--ok-soft);color:var(--ok)}
.chip.r{background:var(--pen-soft);color:var(--pen)}
.chip.y{background:#fdf3e0;color:var(--amber)}
.chip.b{background:#eef0f6;color:#5a637c}
.sec-title{font-size:26px;margin:26px 0 12px}
.video-wrap{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
video.vid{width:100%;border-radius:12px;background:#000}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
.toolbar h2{font-size:27px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:6px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat b{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:32px;display:block;font-weight:400}
.stat span{font-size:13px;color:var(--ink-2);font-weight:600}
.exam-row{display:flex;gap:18px;padding:18px;margin-bottom:14px;flex-wrap:wrap}
.ex-info{flex:1;min-width:240px}
.ex-info h3{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:22px;font-weight:400}
.ex-meta{font-size:13px;color:var(--ink-2);margin:4px 0 8px;font-weight:600}
.ex-link code{font-size:12px;background:#f1efe6;border:1px solid var(--line);padding:4px 10px;border-radius:8px;word-break:break-all}
.ex-side{display:flex;flex-direction:column;gap:10px;align-items:flex-start;justify-content:center}
.ex-stats{font-size:13px;font-weight:700;color:var(--ink-2)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:18px}
@media(max-width:800px){.form-grid{grid-template-columns:1fr}}
.form-grid3{display:grid;grid-template-columns:2fr 1fr;gap:0 16px}
.form-grid3 .span2{grid-column:span 2}
@media(max-width:700px){.form-grid3{grid-template-columns:1fr}.form-grid3 .span2{grid-column:auto}}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;font-weight:700;user-select:none}
.switch input{display:none}
.switch span{width:42px;height:24px;background:#c9cee0;border-radius:20px;position:relative;transition:.2s;flex:none}
.switch span::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{right:21px}
.switch em{font-style:normal}
.q-item{padding:18px;margin-bottom:14px}
.qi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.q-badge{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:18px;background:var(--pen);color:#fff;padding:1px 14px;border-radius:10px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px;transition:.15s;color:var(--ink)}
.icon-btn:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.icon-btn.danger:hover{border-color:var(--pen);color:var(--pen)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.qi-body{display:flex;gap:20px;flex-wrap:wrap}
.qi-img{flex:1;min-width:250px;display:flex;flex-direction:column;gap:8px}
.qprev{border:2px dashed var(--line);border-radius:12px;min-height:110px;display:grid;place-items:center;padding:8px;background:#fcfbf6}
.qprev-img{max-width:100%;max-height:280px;border-radius:8px}
.qprev-empty{font-size:13px;color:#9aa0b5;text-align:center;padding:14px}
.qi-corr{min-width:190px}
.corr-opts{display:flex;gap:8px}
.corr{cursor:pointer}
.corr input{display:none}
.corr span{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:'Lalezar','Vazirmatn',sans-serif;font-size:20px;transition:.15s}
.corr:hover span{border-color:var(--ok)}
.corr.on span,.corr input:checked+span{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .25s}
.save-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px}
#linkBox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
#linkBox code{font-size:12px;background:#f1efe6;border:1px solid var(--line);padding:5px 10px;border-radius:8px;word-break:break-all}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;color:var(--ink-2);font-size:12.5px;border-bottom:2px solid var(--line);padding:10px 8px;white-space:nowrap}
.tbl td{padding:11px 8px;border-bottom:1px solid #ece8db;vertical-align:middle}
.tbl tr:hover td{background:#faf8f0}
.sel-w{width:auto;min-width:200px}
.overlay{position:fixed;inset:0;background:rgba(15,22,50,.55);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:18px;animation:fadeUp .2s;overflow-y:auto}
.modal{background:#fff;border-radius:18px;padding:26px;max-width:540px;width:100%;animation:popIn .25s cubic-bezier(.2,.9,.3,1.2);max-height:90vh;overflow-y:auto}
.modal:has(.lb-img){max-width:min(96vw,1000px);max-height:none;overflow:visible}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.modal .disp{font-size:24px;margin-bottom:10px}
.m-msg{line-height:2;margin-bottom:14px}
.m-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.lb-img{max-width:100%;border-radius:10px;display:block}
.creds{background:#f4f2e9;border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:14px;line-height:2.1;white-space:pre-wrap;margin:10px 0}
.det-row{display:flex;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid #eee9db;font-size:14px;flex-wrap:wrap}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:300;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast-item{background:var(--ink);color:#fff;padding:12px 24px;border-radius:12px;box-shadow:0 10px 30px -8px rgba(20,30,70,.5);font-weight:700;font-size:14px;animation:fadeUp .3s}
.toast-item.err{background:var(--pen)}
.loading{padding:44px;text-align:center;color:var(--ink-2);font-weight:600;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.45}}
.empty{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--ink-2);font-weight:600}
.greet{margin-bottom:20px}
.greet h2{font-size:32px}
.greet p{color:var(--ink-2);font-weight:500}
.stu-row{display:flex;justify-content:space-between;gap:14px;padding:18px 20px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.stu-row h3{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:21px;font-weight:400}
.stu-side{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.intro{padding:32px;margin-top:30px}
.intro-tag{display:inline-block;background:var(--pen-soft);color:var(--pen);font-size:13px;font-weight:800;padding:4px 14px;border-radius:99px;margin-bottom:10px}
.intro h2{font-size:34px}
.intro-meta{display:flex;gap:26px;margin:18px 0;justify-content:center;flex-wrap:wrap}
.im{display:flex;flex-direction:column;align-items:center;background:#f7f5ec;border:1px solid var(--line);border-radius:14px;padding:12px 26px}
.im b{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:30px}
.im span{font-size:13px;color:var(--ink-2);font-weight:700}
.rules{list-style:none;margin:6px 0 22px;display:grid;gap:8px}
.rules li{position:relative;padding-right:22px;font-size:14.5px;line-height:1.9;color:var(--ink-2)}
.rules li::before{content:'✏️';position:absolute;right:0;top:2px;font-size:13px}
.big-msg{font-size:18px;font-weight:700;margin-bottom:18px;line-height:2}
.narrow-card{max-width:480px;margin-top:30px}
.sep{border:none;border-top:1px dashed var(--line);margin:18px 0}
.steps{padding-right:20px;line-height:2.4}
/* ── دکمه شناور افزودن سؤال ── */
.fab{position:fixed;bottom:24px;left:24px;background:var(--pen);color:#fff;border:none;border-radius:50%;width:58px;height:58px;font-size:28px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px -4px rgba(217,44,69,.55);z-index:30;transition:.2s;display:grid;place-items:center}
.fab:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 12px 28px -4px rgba(217,44,69,.75)}
/* ── انتخاب چندتایی دانش‌آموزان ── */
.stu-pick{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fcfbf6;max-height:240px;overflow-y:auto}
.stu-pick-row{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:.12s}
.stu-pick-row:hover{background:#f0ecde}
.stu-pick-row input{width:18px;height:18px;accent-color:var(--ok);flex:none}
.stu-pick-row span{flex:1;font-size:14px;font-weight:600}
.stu-pick-row em{font-style:normal;color:#8a8fa6;font-size:12px}
/* ── نمودار خطی ── */
.chart-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}
.chart-wrap svg{width:100%;height:260px;display:block}
.chart-grid{stroke:#ece8db;stroke-width:1;stroke-dasharray:3 3}
.chart-line{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart-area{fill:rgba(28,43,94,.08)}
.chart-point{fill:var(--ink);stroke:#fff;stroke-width:2;cursor:pointer}
.chart-point.best{fill:var(--ok);stroke:#fff;stroke-width:3}
.chart-point.worst{fill:var(--pen);stroke:#fff;stroke-width:3}
.chart-lbl{font-family:'Vazirmatn';font-size:10px;fill:var(--ink-2);text-anchor:middle;dominant-baseline:hanging}
.chart-val{font-family:'Lalezar','Vazirmatn';font-size:12px;fill:var(--ink);text-anchor:middle}
.chart-val.best{fill:var(--ok)}
.chart-val.worst{fill:var(--pen)}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-2);font-weight:700;justify-content:center}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* ── کارت اشتباهات ── */
.mist-card{padding:18px;margin-bottom:14px;border-right:4px solid var(--pen)}
.mist-card.blank{border-right-color:var(--amber)}
.mist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.mist-meta{font-size:12px;color:var(--ink-2);font-weight:700}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

<body>
<div class="margin-line"></div>
<div id="bg-syms" aria-hidden="true"></div>
<main id="app"><div class="loading">در حال بارگذاری…</div></main>
<div id="toast"></div>
<script>
'use strict';
const API_URL = "https://azmoonak-api.p-asnaashari2007.workers.dev";

const appEl = document.getElementById('app');
const $ = s => document.querySelector(s);
const fa = n => Number(n ?? 0).toLocaleString('fa-IR');
const faStr = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const examLink = id => location.origin + location.pathname + '#/exam/' + id;
function fmtTimer(sec) { sec = Math.max(0, Math.floor(sec)); return faStr(String(Math.floor(sec / 60)).padStart(2, '0')) + ':' + faStr(String(sec % 60).padStart(2, '0')); }
function fmtDur(ms) { const s = Math.max(0, Math.round((ms || 0) / 1000)); return faStr(String(Math.floor(s / 60)).padStart(2, '0')) + ':' + faStr(String(s % 60).padStart(2, '0')); }
function fmtDate(ts) { try { return new Date(ts).toLocaleString('fa-IR', { dateStyle: 'short', timeStyle: 'short' }); } catch { return ''; } }
function calcPercent(correct, wrong, total) {
  if (!total) return 0;
  const raw = (100 * (3 * correct - wrong)) / (3 * total);
  // درصد بین -۳۳٪ و +۱۰۰٪ می‌تواند باشد
  return Math.max(-34, Math.min(100, Math.round(raw)));
}
function toast(msg, type = 'ok') {
  const box = document.getElementById('toast'); const el = document.createElement('div');
  el.className = 'toast-item' + (type === 'err' ? ' err' : ''); el.textContent = msg; box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.4s'; setTimeout(() => el.remove(), 420); }, 2800);
}
function copyText(t) {
  const legacy = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('کپی شد ✓'); } catch { toast('کپی نشد', 'err'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(() => toast('کپی شد ✓')).catch(legacy); } else legacy();
}
function fileToDataURL(file, maxW = 800) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { let w = img.width, h = img.height; if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.75)); };
    img.onerror = rej; img.src = url;
  });
}
function videoEmbed(url) {
  if (!url) return ''; url = url.trim();
  const mAp = url.match(/aparat\.com\/v\/([A-Za-z0-9]+)/i);
  if (mAp) return '<div class="video-wrap"><iframe src="https://www.aparat.com/video/video/embed/videohash/' + mAp[1] + '/vt/frame" allowfullscreen></iframe></div>';
  const mYt = url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=)([\w-]{6,})/i);
  if (mYt) return '<div class="video-wrap"><iframe src="https://www.youtube.com/embed/' + mYt[1] + '" allowfullscreen></iframe></div>';
  if (/\.(mp4|webm|m4v|mov)(\?|$)/i.test(url)) return '<video class="vid" src="' + esc(url) + '" controls></video>';
  return '<div class="video-wrap"><iframe src="' + esc(url) + '" allowfullscreen></iframe></div>';
}

let authToken = localStorage.getItem('az_token') || '';
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
  let res;
  try { res = await fetch(API_URL + path, { ...opts, headers }); }
  catch (e) { throw new Error('ارتباط با سرور برقرار نشد.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401) { authToken = ''; localStorage.removeItem('az_token'); }
    throw new Error(data.error || 'خطا در سرور');
  }
  return data;
}

let session = null;
try { session = JSON.parse(localStorage.getItem('az_session')); } catch {}
function setSession(s, token) {
  session = s;
  if (token) { authToken = token; localStorage.setItem('az_token', token); }
  s ? localStorage.setItem('az_session', JSON.stringify(s)) : (localStorage.removeItem('az_session'), localStorage.removeItem('az_token'), authToken = '');
}
let timerTick = null;

function openModal(html) {
  closeModal();
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = '<div class="modal">' + html + '</div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  return ov;
}
function closeModal() { document.querySelectorAll('.overlay').forEach(o => o.remove()); }
function confirmBox(msg, onYes, yes = 'بله، مطمئنم') {
  const ov = openModal('<p class="m-msg">' + msg + '</p><div class="m-actions"><button class="btn btn-danger" id="my">' + yes + '</button><button class="btn btn-ghost" id="mn">انصراف</button></div>');
  ov.querySelector('#my').onclick = () => { closeModal(); onYes(); };
  ov.querySelector('#mn').onclick = closeModal;
}
function promptBox(title, label, onOk) {
  const ov = openModal('<h3 class="disp">' + title + '</h3><label class="lbl">' + label + '</label><input class="inp" id="pv"><div class="m-actions"><button class="btn btn-primary" id="po">تأیید</button><button class="btn btn-ghost" id="pc">انصراف</button></div>');
  const inp = ov.querySelector('#pv'); inp.focus();
  const go = () => { const v = inp.value.trim(); if (!v) return; closeModal(); onOk(v); };
  ov.querySelector('#po').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  ov.querySelector('#pc').onclick = closeModal;
}
function messagePage(txt) {
  const top = (session && session.role === 'student') ? studentTop() : '';
  appEl.innerHTML = top + '<div class="wrap narrow"><div class="card pad center fade-up" style="margin-top:44px"><p class="big-msg">' + txt + '</p><a class="btn btn-primary" href="#/">صفحهٔ ورود</a></div></div>';
}

async function route() {
  clearInterval(timerTick); timerTick = null; window.onbeforeunload = null;
  const raw = (location.hash || '#/').slice(2);
  const qi = raw.indexOf('?');
  const path = qi >= 0 ? raw.slice(0, qi) : raw;
  const query = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : '');
  const seg = path.split('/').filter(Boolean);
  try {
    if (!seg.length || seg[0] === 'login') return renderLogin(query.get('next'));
    if (seg[0] === 'student') return await viewStudentHome();
    if (seg[0] === 'mistakes') return await viewMistakes();
    if (seg[0] === 'exam') return await viewExam(seg[1]);
    if (seg[0] === 'result') return await viewResult(seg[1]);
    if (seg[0] === 'admin') {
      if (seg[1] === 'result' && seg[2]) return await adminViewResult(seg[2]);
      return await viewAdmin(seg);
    }
    location.hash = '#/';
  } catch (err) {
    console.error(err);
    messagePage('خطایی پیش آمد. صفحه را رفرش کن.');
  }
}

function renderLogin(next) {
  if (session) { location.replace(session.role === 'admin' ? '#/admin' : '#/student'); return; }
  appEl.innerHTML =
    '<div class="login-page">' +
    '<div class="login-hero fade-up">' +
    '<div class="hero-logo"><span class="tick big">√</span><h1>آزمونک</h1></div>' +
    '<p class="tag">پلتفرم آزمون‌های خصوصی ریاضی</p>' +
    '<ul class="feats">' +
    '<li class="fade-up">⏱ تایمر دقیق، بالای صفحهٔ آزمون</li>' +
    '<li class="fade-up" style="animation-delay:.1s">🖼 سؤالات تصویری، چهار گزینه‌ای</li>' +
    '<li class="fade-up" style="animation-delay:.2s">📊 کارنامه و درصدِ آنی بعد از ثبت</li>' +
    '<li class="fade-up" style="animation-delay:.3s">🎬 پاسخ ویدئویی و کلید بعد از آزمون</li>' +
    '</ul>' +
    '</div>' +
    '<form class="card login-card fade-up" id="loginForm" style="animation-delay:.15s">' +
    '<h2 class="disp">ورود به آزمونک</h2>' +
    '<label class="lbl">نام کاربری</label><input class="inp" id="lu" dir="ltr" autocomplete="username" required>' +
    '<label class="lbl">رمز عبور</label><input class="inp" id="lp" dir="ltr" type="password" autocomplete="current-password" required>' +
    '<button class="btn btn-primary big full" id="loginBtn">ورود</button>' +
    '<p class="hint">حساب دانش‌آموزی فقط توسط مدیر ساخته می‌شود.</p>' +
    '</form>' +
    '</div>';
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#loginBtn'), u = $('#lu').value.trim(), p = $('#lp').value;
    if (!u || !p) return;
    btn.disabled = true; btn.textContent = 'در حال ورود…';
    try {
      const data = await api('/api/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
      setSession(data.user, data.token);
      location.hash = (next && next.startsWith('#')) ? next : (data.user.role === 'admin' ? '#/admin' : '#/student');
    } catch (err) {
      toast(err.message || 'خطا در ورود', 'err');
      btn.disabled = false; btn.textContent = 'ورود';
    }
  };
}

function studentTop() {
  return '<header class="topbar"><div class="inner">' +
    '<a class="logo" href="#/student" style="text-decoration:none"><span class="tick">√</span> آزمونک</a>' +
    '<span class="spacer"></span>' +
    '<a class="tab" href="#/mistakes">📚 مرور اشتباهات</a>' +

function adminShell(active, fn) {

async function viewStudentHome() {
  if (!session || session.role !== 'student') { location.hash = '#/login?next=%23%2Fstudent'; return; }
  appEl.innerHTML = studentTop() + '<div class="wrap narrow"><div class="greet fade-up"><h2 class="disp">سلام، ' + esc(session.name) + ' 👋</h2><p>آزمون‌های تو اینجاست.</p></div><div id="chartArea"></div><div id="exlist"><div class="loading">در حال بارگذاری…</div></div></div>';
  const [exData, resData] = await Promise.all([api('/api/exams'), api('/api/results')]);
  const exams = exData.exams;
  const resMap = {};
  const finished = [];
  resData.results.forEach(r => {
    resMap[r.examId] = r;
    if (r.status === 'done') finished.push(r);
  });
  finished.sort((a, b) => (a.finishedAt || 0) - (b.finishedAt || 0));
  drawChart(finished, '#chartArea');
  const list = $('#exlist');
  if (!exams.length) {
    list.innerHTML = '<div class="empty" style="margin-top:14px">هنوز آزمونی برایت ثبت نشده است. 📭</div>';
    return;
  }
  list.innerHTML = '<h2 class="disp sec-title">آزمون‌های من</h2>' + exams.map((e, i) => {
    const r = resMap[e.id]; let chip, action;
    if (r && r.status === 'done') {
      chip = '<span class="chip ' + (r.percent >= 80 ? 'g' : r.percent >= 50 ? 'y' : 'r') + '">شرکت کرده — ' + fa(r.percent) + '٪</span>';
      action = '<a class="btn btn-ghost btn-sm" href="#/result/' + r.id + '">📄 کارنامه</a>';
    } else if (r && r.status === 'active') {
      chip = '<span class="chip y">در حال برگزاری…</span>';
      action = '<a class="btn btn-primary btn-sm" href="#/exam/' + e.id + '">▶ ادامه</a>';
    } else {
      chip = '<span class="chip b">آماده</span>';
      action = '<a class="btn btn-primary btn-sm" href="#/exam/' + e.id + '">📝 شرکت</a>';
    }
    return '<div class="card stu-row fade-up" style="animation-delay:' + (i * 70) + 'ms"><div><h3>' + esc(e.title) + '</h3><div class="ex-meta">' + fa(e.questions.length) + ' سؤال · ' + fa(e.duration) + ' دقیقه</div></div><div class="stu-side">' + chip + action + '</div></div>';
  }).join('');
}

/* ── نمودار خطی پیشرفت ── */
function drawChart(finished, sel) {
  const host = document.querySelector(sel);
  if (!host) return;
  if (!finished.length) { host.innerHTML = ''; return; }
  const W = 680, H = 260, padL = 40, padR = 30, padT = 30, padB = 50;
  const n = finished.length;
  const best = Math.max(...finished.map(r => r.percent));
  const worst = Math.min(...finished.map(r => r.percent));
  const avg = Math.round(finished.reduce((s, r) => s + r.percent, 0) / n);
  const xStep = n === 1 ? (W - padL - padR) : (W - padL - padR) / (n - 1);
  // 🔸 دامنهٔ نمودار: از حداقلِ (۰ یا worst) تا ۱۰۰
  const yMin = Math.min(0, worst);
  const yMax = 100;
  const yOf = p => padT + (1 - (p - yMin) / (yMax - yMin)) * (H - padT - padB);
  const pts = finished.map((r, i) => ({ x: padL + i * xStep, y: yOf(r.percent), r }));
  const pathD = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const areaD = pathD + ' L ' + pts[pts.length - 1].x.toFixed(1) + ' ' + (H - padB) + ' L ' + pts[0].x.toFixed(1) + ' ' + (H - padB) + ' Z';

  let gridLines = '';
  const gridValues = yMin < 0 ? [-25, 0, 25, 50, 75, 100] : [0, 25, 50, 75, 100];
  gridValues.forEach(v => {
    const y = yOf(v);
    const isZero = v === 0;
    const strokeW = isZero ? 1.5 : 1;
    const strokeColor = isZero ? '#8a8fa6' : '#ece8db';
    gridLines += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="' + strokeColor + '" stroke-width="' + strokeW + '"' + (isZero ? '' : ' stroke-dasharray="3 3"') + '/>';
    gridLines += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" font-family="Vazirmatn" font-size="10" fill="' + (v < 0 ? '#d92c45' : '#8a8fa6') + '" text-anchor="end" font-weight="' + (v < 0 ? '800' : '400') + '">' + fa(v) + '</text>';
  });

  const points = pts.map(p => {
    const isBest = p.r.percent === best && n > 1;
    const isWorst = p.r.percent === worst && n > 1 && best !== worst;
    const cls = isBest ? 'chart-point best' : (isWorst ? 'chart-point worst' : 'chart-point');
    const valCls = isBest ? 'chart-val best' : (isWorst ? 'chart-val worst' : 'chart-val');
    return '<circle class="' + cls + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5" data-ex="' + esc(p.r.examTitle) + '" data-pc="' + p.r.percent + '" data-dt="' + fmtDate(p.r.finishedAt) + '"/>' +
      '<text class="' + valCls + '" x="' + p.x.toFixed(1) + '" y="' + (p.y - 10).toFixed(1) + '">' + fa(p.r.percent) + '٪</text>';
  }).join('');

  const labels = pts.map((p, i) => {
    if (n > 6 && i % Math.ceil(n / 6) !== 0 && i !== n - 1) return '';
    return '<text class="chart-lbl" x="' + p.x.toFixed(1) + '" y="' + (H - padB + 16) + '">' + (i + 1) + '</text>';
  }).join('');

  host.innerHTML = '<div class="chart-wrap fade-up">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px">' +
    '<h3 class="disp" style="font-size:22px">📈 روند پیشرفت</h3>' +
    '<div style="font-size:13px;color:var(--ink-2);font-weight:700">میانگین: <b>' + fa(avg) + '٪</b> · بهترین: <b style="color:var(--ok)">' + fa(best) + '٪</b></div>' +
    '</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
    gridLines +
    '<path class="chart-area" d="' + areaD + '"/>' +
    '<path class="chart-line" d="' + pathD + '"/>' +
    points +
    labels +
    '</svg>' +
    '<div class="chart-legend">' +
    '<span><i style="background:var(--ink)"></i>درصد آزمون</span>' +
    (n > 1 ? '<span><i style="background:var(--ok)"></i>بهترین</span><span><i style="background:var(--pen)"></i>نیاز به تلاش بیشتر</span>' : '') +
    '</div>' +
    '<p class="hint">برای دیدن جزئیات هر آزمون، روی نقاط کلیک کن.</p>' +
    '</div>';

  host.querySelectorAll('.chart-point').forEach(c => {
    c.onclick = () => toast('📌 ' + c.dataset.ex + ' — ' + fa(+c.dataset.pc) + '٪ — ' + c.dataset.dt);
  });
}

async function viewExam(id) {
  if (!id) { location.hash = '#/student'; return; }
  if (!session) { location.hash = '#/login?next=' + encodeURIComponent('#/exam/' + id); return; }
  if (session.role !== 'student') { messagePage('برای شرکت در آزمون باید با حساب دانش‌آموز وارد شوی.'); return; }
  let exam;
  try {
    const data = await api('/api/exam/' + id);
    exam = data.exam;
  } catch (err) { messagePage(err.message || 'آزمون پیدا نشد.'); return; }
  if (!exam.published) { messagePage('این آزمون هنوز فعال نشده.'); return; }
  let existing = null;
  try {
    const rData = await api('/api/result/' + id + '_' + session.id);
    existing = rData.result;
  } catch { }
  if (existing) {
    if (existing.status === 'done') { location.replace('#/result/' + existing.id); return; }
    if (existing.status === 'active') { runExam(exam, existing); return; }
  }
  // 🔸 حذف نمایش «۴ گزینه» - فقط سؤال و زمان
  appEl.innerHTML = studentTop() + '<div class="wrap narrow"><div class="card intro fade-up">' +
    '<span class="intro-tag">آزمون تستی</span>' +
    '<h2 class="disp">' + esc(exam.title) + '</h2>' +
    '<div class="intro-meta">' +
    '<div class="im"><b>' + fa(exam.questions.length) + '</b><span>سؤال</span></div>' +
    '<div class="im"><b>' + fa(exam.duration) + '</b><span>دقیقه</span></div>' +
    '</div>' +
    '<div style="background:var(--pen-soft);border:2px solid var(--pen);border-radius:12px;padding:14px 18px;margin:18px 0;font-weight:700;color:var(--pen);display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.8">' +
    '<span style="font-size:22px">⚠️</span>' +
    '<span>این آزمون <b>نمرهٔ منفی</b> دارد. <b style="color:#b91c2e">هر ۳ پاسخ غلط، یک پاسخ صحیح را می‌سوزاند.</b> پس فقط به سؤالاتی که مطمئنی پاسخ بده!</span>' +
    '</div>' +
    '<ul class="rules">' +
    '<li>به محض زدن دکمهٔ شروع، زمان به جریان می‌افتد.</li>' +
    '<li>می‌توانی پاسخ‌هایت را تا قبل از ثبت تغییر دهی.</li>' +
    '<li>با پایان زمان، پاسخ‌های داده‌شده خودکار ثبت می‌شوند.</li>' +
    '</ul>' +
    '<button class="btn btn-primary big" id="startBtn">▶ شروع آزمون</button>' +
    '</div></div>';
  $('#startBtn').onclick = async () => {
    const btn = $('#startBtn'); btn.disabled = true; btn.textContent = 'در حال آماده‌سازی…';
    try {
      const data = await api('/api/result/' + id + '/start', { method: 'POST' });
      runExam(exam, data.result);
    } catch (err) {
      toast(err.message, 'err');
      btn.disabled = false; btn.textContent = '▶ شروع آزمون';
    }
  };
}

function examHTML(exam, answers) {
  const qs = exam.questions.map((q, i) =>
    '<section class="card q-card fade-up" data-q="' + i + '" style="animation-delay:' + Math.min(i * 70, 600) + 'ms">' +

function runExam(exam, state) {
  const answers = [...(state.answers || [])];
  while (answers.length < exam.questions.length) answers.push(0);
  const total = exam.questions.length;
  const deadline = state.startedAt + exam.duration * 60000;
  let saving = null, finished = false;
  appEl.innerHTML = examHTML(exam, answers);
  const timerEl = $('#timer'), fillEl = $('#tfill'), ansEl = $('#answered');
  function paint() {
    const done = answers.filter(a => a > 0).length;
    ansEl.textContent = fa(done) + ' از ' + fa(total);
    const rem = Math.max(0, deadline - Date.now());
    timerEl.textContent = fmtTimer(rem / 1000);
    timerEl.classList.toggle('low', rem < 60000);
    fillEl.style.width = (rem / (exam.duration * 60000) * 100) + '%';
    if (rem <= 0 && !finished) { finished = true; toast('⏰ زمان تمام شد'); finish(); }
  }
  document.querySelectorAll('.q-card').forEach(card => {
    const qi = +card.dataset.q;
    card.querySelectorAll('.opt').forEach(b => {
      b.onclick = () => {
        if (finished) return;
        answers[qi] = +b.dataset.o;
        card.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
        paint();
        clearTimeout(saving); saving = setTimeout(() => api('/api/result/' + state.id, { method: 'PUT', body: JSON.stringify({ answers }) }).catch(() => { }), 600);
      };
    });
  });
  const doSubmit = () => {
    if (finished) return;
    const done = answers.filter(a => a > 0).length;
    const ov = openModal('<h3 class="disp">ثبت نهایی آزمون</h3><p class="m-msg">به <b>' + fa(done) + '</b> سؤال از <b>' + fa(total) + '</b> پاسخ داده‌ای.<br>مطمئنی؟</p>' +
      '<div class="m-actions"><button class="btn btn-primary" id="fy">✔ ثبت</button><button class="btn btn-ghost" id="fn">ادامه</button></div>');
    ov.querySelector('#fy').onclick = () => { closeModal(); finished = true; finish(); };
    ov.querySelector('#fn').onclick = closeModal;
  };
  $('#submitBtn').onclick = doSubmit; $('#submitBtn2').onclick = doSubmit;
async function finish() {
    clearInterval(timerTick); window.onbeforeunload = null;
    let correct = 0; exam.questions.forEach((q, i) => { if (answers[i] === q.correct) correct++; });
    const blank = answers.filter(a => a === 0).length, wrong = total - correct - blank;
    const percent = calcPercent(correct, wrong, total);
    try { await api('/api/result/' + state.id, { method: 'PUT', body: JSON.stringify({ status: 'done', answers, correct, wrong, blank, total, percent, finishedAt: Date.now() }) }); } catch (e) { console.error(e); }
    location.hash = '#/result/' + state.id;
}
  window.onbeforeunload = e => { e.preventDefault(); return ''; };
  paint();
  timerTick = setInterval(paint, 250);
}

async function viewMistakes() {
  if (!session || session.role !== 'student') { location.hash = '#/login'; return; }
  appEl.innerHTML = studentTop() + '<div class="wrap narrow"><div class="greet fade-up"><h2 class="disp">📚 مرور اشتباهات</h2><p>سؤالاتی که در آزمون‌ها غلط زدی یا بی‌پاسخ گذاشتی؛ برای تمرین دوباره.</p></div><div id="mistFilter" class="filter-tabs"></div><div id="mistList"><div class="loading">در حال بارگذاری…</div></div></div>';
  const [exData, resData] = await Promise.all([api('/api/exams'), api('/api/results')]);
  const exams = {}; exData.exams.forEach(e => exams[e.id] = e);
  const mistakes = [];
  resData.results.forEach(r => {
    if (r.status !== 'done') return;
    const exam = exams[r.examId]; if (!exam) return;
    exam.questions.forEach((q, i) => {
      const a = (r.answers || [])[i] || 0;
      if (a === q.correct) return;
      mistakes.push({ examId: r.examId, examTitle: r.examTitle, qi: i, q, a, finishedAt: r.finishedAt, percent: r.percent, status: a === 0 ? 'blank' : 'wrong' });
    });
  });
  mistakes.sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
  const filterEl = $('#mistFilter');
  const nWrong = mistakes.filter(m => m.status === 'wrong').length;
  const nBlank = mistakes.filter(m => m.status === 'blank').length;
  filterEl.innerHTML = '<button class="filter-tab active" data-f="all">همه (' + fa(mistakes.length) + ')</button>' +
    '<button class="filter-tab" data-f="wrong">✘ غلط (' + fa(nWrong) + ')</button>' +
    '<button class="filter-tab" data-f="blank">⚪ بی‌پاسخ (' + fa(nBlank) + ')</button>';
  const render = f => {
    const list = $('#mistList');
    const rows = mistakes.filter(m => f === 'all' || m.status === f);
    if (!rows.length) { list.innerHTML = '<div class="empty">🎉 هیچ سؤال اشتباه یا بی‌پاسخی نداری!</div>'; return; }
    list.innerHTML = rows.map((m, i) => {
      const stChip = m.status === 'wrong' ? '<span class="chip r">✘ غلط</span>' : '<span class="chip y">⚪ بی‌پاسخ</span>';
      return '<div class="card pad mist-card ' + m.status + ' fade-up" style="animation-delay:' + Math.min(i * 50, 600) + 'ms">' +
        '<div class="mist-head"><div><b>' + esc(m.examTitle) + '</b> · سؤال ' + fa(m.qi + 1) +
        '<div class="mist-meta">' + fmtDate(m.finishedAt) + ' · درصد آزمون: ' + fa(m.percent) + '٪</div></div><div>' + stChip + '</div></div>' +
        '<img class="qimg" src="' + m.q.img + '" loading="lazy" onerror="this.style.display=\'none\'">' +
        '<div class="opts">' + [1, 2, 3, 4].map(o => {
          let cls = '', tag = '';
          if (o === m.q.correct) { cls = 'good'; tag = '<span class="tag t-ok">' + (m.a === o ? 'انتخاب تو ✓' : 'پاسخ صحیح') + '</span>'; }
          else if (o === m.a) { cls = 'bad'; tag = '<span class="tag t-bad">انتخاب تو</span>'; }
          return '<div class="opt ro ' + cls + '"><span class="n">' + fa(o) + '</span><span>گزینهٔ ' + fa(o) + '</span>' + tag + '</div>';
        }).join('') + '</div>' +
        '</div>';
    }).join('');
  };
  filterEl.querySelectorAll('.filter-tab').forEach(b => b.onclick = () => {
    filterEl.querySelectorAll('.filter-tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    render(b.dataset.f);
  });
  render('all');
}

        '<label class="switch"><input type="checkbox" data-pub="' + e.id + '" ' + (e.published ? 'checked' : '') + '><span></span><em>' + (e.published ? 'فعال' : 'غیرفعال') + '</em></label>' +
        '<div class="row-actions">' +

        '<a class="btn btn-ghost btn-sm" href="#/admin/edit/' + e.id + '">✏️ ویرایش</a>' +
        '<button class="btn btn-danger-o btn-sm" data-del="' + e.id + '">🗑 حذف</button>' +
        '</div></div></div>';
    }).join('');
  box.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy));
  box.querySelectorAll('[data-pub]').forEach(c => c.onchange = async () => {
    await api('/api/exam/' + c.dataset.pub + '/publish', { method: 'POST', body: JSON.stringify({ published: c.checked }) });

    await api('/api/exam/' + b.dataset.del, { method: 'DELETE' }); toast('حذف شد'); route();
  }));
}

let draft = null, editingId = null, allStudents = [];
async function adminEditor(id) {
  editingId = id || null;
  try {
    const d = await api('/api/students');
    allStudents = d.students;
  } catch { allStudents = []; }
  if (id) {
    try {
      const d = await api('/api/exam/' + id);
      const e = d.exam;
      draft = { title: e.title, duration: e.duration, videoUrl: e.videoUrl || '', published: !!e.published, questions: e.questions.map(q => ({ img: q.img, correct: q.correct })), allowedStudents: e.allowedStudents || [] };
    } catch { toast('آزمون پیدا نشد', 'err'); location.hash = '#/admin'; return; }
  } else draft = { title: '', duration: 30, videoUrl: '', published: true, questions: [], allowedStudents: [] };
  drawEditor();
}
function drawEditor() {
  const stuPick = allStudents.length ? allStudents.map(s => {
    const checked = draft.allowedStudents.includes(s.id);
    return '<label class="stu-pick-row"><input type="checkbox" value="' + esc(s.id) + '" ' + (checked ? 'checked' : '') + '><span>' + esc(s.name) + '</span><em dir="ltr">' + esc(s.username) + '</em></label>';
  }).join('') : '<p class="hint" style="text-align:center;padding:12px">هنوز دانش‌آموزی نساخته‌ای.</p>';
  $('#adminContent').innerHTML =
    '<div class="card pad fade-up"><h2 class="disp" style="font-size:28px">' + (editingId ? 'ویرایش آزمون' : 'ساخت آزمون جدید') + '</h2>' +
    '<div class="form-grid3">' +
    '<div class="span2"><label class="lbl">عنوان آزمون</label><input id="e-title" class="inp" value="' + esc(draft.title) + '" placeholder="مثلاً: آزمون ریاضی نهم"></div>' +
    '<div><label class="lbl">مدت (دقیقه)</label><input id="e-duration" type="number" min="1" class="inp" value="' + draft.duration + '"></div>' +
    '<div class="span2"><label class="lbl">لینک پاسخ ویدئویی (اختیاری)</label><input id="e-video" dir="ltr" class="inp" value="' + esc(draft.videoUrl) + '" placeholder="https://www.aparat.com/v/xxxxx">' +
    '<p class="hint">لینک آپارات یا یوتیوب.</p></div>' +
    '<div><label class="lbl">وضعیت</label><label class="switch"><input type="checkbox" id="e-pub" ' + (draft.published ? 'checked' : '') + '><span></span><em>فعال</em></label></div>' +
    '<div class="span2"><label class="lbl">دسترسی دانش‌آموزان 🔐</label>' +
    '<div class="stu-pick" id="stuPick">' + stuPick + '</div>' +
    '<p class="hint">اگر هیچ‌کس را انتخاب نکنی، <b>همهٔ دانش‌آموزان</b> دسترسی دارند. در غیر این صورت فقط دانش‌آموزان انتخاب‌شده آزمون را می‌بینند.</p></div>' +
    '</div></div>' +
    '<div class="toolbar"><h2 class="disp">سؤال‌ها</h2></div>' +
    '<div id="qlist"></div>' +
    '<div class="card pad save-bar fade-up">' +
    '<button class="btn btn-primary big" id="saveExam">' + (editingId ? '💾 ذخیرهٔ تغییرات' : '💾 ساخت آزمون') + '</button>' +
    '<div id="linkBox"></div>' +
    '</div>';
  // 🔸 دکمه شناور افزودن سؤال
  let fab = document.getElementById('qFab');
  if (!fab) {
    fab = document.createElement('button');
    fab.id = 'qFab';
    fab.className = 'fab';
    fab.title = 'افزودن سؤال جدید';
    fab.textContent = '+';
    document.body.appendChild(fab);
  }
  fab.style.display = 'grid';
  fab.onclick = () => { draft.questions.push({ img: '', correct: 1 }); drawQList(); setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 50); };
  $('#saveExam').onclick = saveExam;
  if (editingId) showLink();
  drawQList();
}
function qItemHTML(q, i) {
  const prev = q.img ? '<img class="qprev-img" src="' + esc(q.img) + '" onerror="this.style.display=\'none\'">' : '<span class="qprev-empty">تصویر سؤال اینجا نمایش داده می‌شود 📷</span>';
  return '<div class="card q-item fade-up" data-i="' + i + '">' +
    '<div class="qi-head"><span class="q-badge">سؤال ' + fa(i + 1) + '</span><div class="qi-tools">' +
    '<button class="icon-btn" ' + (i === 0 ? 'disabled' : '') + ' data-act="up">↑</button> ' +
    '<button class="icon-btn" ' + (i === draft.questions.length - 1 ? 'disabled' : '') + ' data-act="down">↓</button> ' +
    '<button class="icon-btn danger" data-act="del">✕</button>' +
    '</div></div>' +
    '<div class="qi-body">' +
    '<div class="qi-img"><div class="qprev">' + prev + '</div>' +
    '<input type="file" class="qfile" accept="image/*" hidden>' +
    '<button class="btn btn-ghost btn-sm" data-act="pick">📤 آپلود تصویر</button>' +
    '<input class="inp qurl" dir="ltr" placeholder="…یا لینک تصویر" value="' + esc(q.img) + '"></div>' +
    '<div class="qi-corr"><p class="lbl" style="margin-top:0">پاسخ صحیح:</p><div class="corr-opts">' +
    [1, 2, 3, 4].map(o => '<label class="corr ' + (q.correct === o ? 'on' : '') + '"><input type="radio" name="corr' + i + '" value="' + o + '" ' + (q.correct === o ? 'checked' : '') + '><span>' + fa(o) + '</span></label>').join('') +
    '</div><p class="hint">مقادیر گزینه‌ها داخل عکس است.</p></div>' +
    '</div></div>';
}
function drawQList() {
  const box = $('#qlist');
  if (!draft.questions.length) { box.innerHTML = '<div class="empty" style="margin-bottom:14px">هنوز سؤالی اضافه نکرده‌ای.<br>از دکمهٔ قرمز پایین صفحه استفاده کن +</div>'; return; }
  box.innerHTML = draft.questions.map((q, i) => qItemHTML(q, i)).join('');
  box.querySelectorAll('.q-item').forEach(el => {
    const i = +el.dataset.i, q = draft.questions[i];
    el.querySelector('[data-act="pick"]').onclick = () => el.querySelector('.qfile').click();
    el.querySelector('.qfile').onchange = async ev => {
      const f = ev.target.files[0]; if (!f) return;
      el.querySelector('.qprev').innerHTML = '<span class="qprev-empty">⏳ در حال پردازش…</span>';
      try {
        q.img = await fileToDataURL(f);
        toast('تصویر سؤال ' + fa(i + 1) + ' آماده شد ✓');
      } catch { toast('خطا در پردازش', 'err'); }
      drawQList();
    };
    const urlIn = el.querySelector('.qurl');
    urlIn.oninput = () => { q.img = urlIn.value.trim();
      el.querySelector('.qprev').innerHTML = q.img ? '<img class="qprev-img" src="' + esc(q.img) + '" onerror="this.style.display=\'none\'">' : '<span class="qprev-empty">تصویر سؤال اینجا 📷</span>'; };
    el.querySelectorAll('input[name="corr' + i + '"]').forEach(r => r.onchange = () => {
      q.correct = +r.value;
      el.querySelectorAll('.corr').forEach(c => c.classList.toggle('on', c.querySelector('input').checked));
    });
    el.querySelectorAll('[data-act]').forEach(b => {
      const act = b.dataset.act;
      const swap = j => { const t = draft.questions[i]; draft.questions[i] = draft.questions[j]; draft.questions[j] = t; drawQList(); };
      if (act === 'up') b.onclick = () => { if (i > 0) swap(i - 1); };
      if (act === 'down') b.onclick = () => { if (i < draft.questions.length - 1) swap(i + 1); };
      if (act === 'del') b.onclick = () => { draft.questions.splice(i, 1); drawQList(); };
    });
  });
}
async function saveExam() {
  draft.title = $('#e-title').value.trim();
  draft.duration = +$('#e-duration').value || 0;
  draft.videoUrl = $('#e-video').value.trim();
  draft.published = $('#e-pub').checked;
  // خواندن دانش‌آموزان انتخاب‌شده
  const checked = [];
  document.querySelectorAll('#stuPick input[type=checkbox]:checked').forEach(cb => checked.push(cb.value));
  draft.allowedStudents = checked;
  if (!draft.title) return toast('عنوان آزمون را بنویس', 'err');
  if (!draft.duration) return toast('مدت را مشخص کن', 'err');
  if (!draft.questions.length) return toast('حداقل یک سؤال', 'err');
  for (let i = 0; i < draft.questions.length; i++) {
    if (!draft.questions[i].img) return toast('تصویر سؤال ' + fa(i + 1) + ' خالی است', 'err');
    if (!draft.questions[i].correct) return toast('پاسخ صحیح سؤال ' + fa(i + 1), 'err');
  }
  const btn = $('#saveExam'); btn.disabled = true; btn.textContent = 'در حال ذخیره…';
  try {
    const body = { id: editingId, ...draft };
    const data = await api('/api/exam', { method: 'POST', body: JSON.stringify(body) });
    editingId = data.id; btn.textContent = '💾 ذخیرهٔ تغییرات';
    toast('آزمون ذخیره شد ✓'); showLink();
  } catch (err) { toast('خطا: ' + err.message, 'err'); }
  btn.disabled = false;
}
function showLink() {
  const lb = $('#linkBox');
  lb.innerHTML = '<span>🔗 لینک آزمون:</span><code dir="ltr">' + examLink(editingId) + '</code><button class="btn btn-ghost btn-sm" id="copyLink">📋 کپی</button>';
  $('#copyLink').onclick = () => copyText(examLink(editingId));
}

async function adminResults() {
  const box = $('#adminContent');
  const [exData, resData] = await Promise.all([api('/api/exams'), api('/api/results')]);
  const exams = {}; exData.exams.forEach(e => exams[e.id] = e.title);
  const all = resData.results.filter(r => r.status === 'done');
  all.sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
  box.innerHTML =
    '<div class="toolbar"><h2 class="disp">نتایج</h2>' +
    '<select class="inp sel-w" id="rFilter"><option value="">همه</option>' +
    Object.entries(exams).map(([id, t]) => '<option value="' + id + '">' + esc(t) + '</option>').join('') + '</select></div>' +
    '<div id="rBody"></div>';
  const render = fid => {
    const rows = all.filter(r => !fid || r.examId === fid);
    const n = rows.length, avg = n ? Math.round(rows.reduce((s, r) => s + r.percent, 0) / n) : 0, best = n ? Math.max(...rows.map(r => r.percent)) : 0;
    $('#rBody').innerHTML =
      '<div class="stats-row">' + statCard('شرکت‌کننده', fa(n)) + statCard('میانگین', n ? fa(avg) + '٪' : '—') + statCard('بهترین', n ? fa(best) + '٪' : '—') + '</div>' +
      '<div class="card pad table-wrap"><table class="tbl"><tr><th>تاریخ</th><th>دانش‌آموز</th><th>آزمون</th><th>درصد</th><th>صحیح</th><th>غلط</th><th>بی‌پاسخ</th><th></th></tr>' +
      (rows.map(r => '<tr><td>' + fmtDate(r.finishedAt) + '</td><td>' + esc(r.studentName) + '</td><td>' + esc(r.examTitle || exams[r.examId] || '—') + '</td>' +
        '<td><span class="chip ' + (r.percent >= 80 ? 'g' : r.percent >= 50 ? 'y' : r.percent >= 0 ? 'r' : 'r') + '" style="' + (r.percent < 0 ? 'background:#fee;color:#7c1d1d;border:1px solid var(--pen)' : '') + '">' + fa(r.percent) + '٪' + (r.percent < 0 ? ' ⚠' : '') + '</span></td>' +
        '<td>' + fa(r.correct) + '</td><td>' + fa(r.wrong) + '</td><td>' + fa(r.blank) + '</td>' +
        '<td><div class="row-actions"><button class="btn btn-ghost btn-sm" data-det="' + r.id + '">جزئیات</button>' +
        '<button class="btn btn-danger-o btn-sm" data-rdel="' + r.id + '">حذف</button></div></td></tr>').join('') ||
        '<tr><td colspan="8" class="center" style="padding:26px">نتیجه‌ای ثبت نشده.</td></tr>') +
      '</table></div>';
    $('#rBody').querySelectorAll('[data-det]').forEach(b => b.onclick = () => {
      location.hash = '#/admin/result/' + b.dataset.det;
    });
    $('#rBody').querySelectorAll('[data-rdel]').forEach(b => b.onclick = () => confirmBox('حذف نتیجه؟', async () => {
      await api('/api/result/' + b.dataset.rdel, { method: 'DELETE' }); toast('حذف شد'); render($('#rFilter').value);
    }));
  };
  $('#rFilter').onchange = e => render(e.target.value);
  render('');
}
